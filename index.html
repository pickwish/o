<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PickWish - Best Online Shopping Store</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel CDN for compiling React JSX directly in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons Library -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
    /* Hide scrollbar for category sub-nav */
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased">
  <!-- React Mount Point -->
  <div id="root"></div>

  <!-- React Code Executed by Babel -->
  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // --- SAMPLE PICKWISH PRODUCT DATA ---
    const INITIAL_PRODUCTS = [
      {
        id: 'prod-1',
        title: 'Echo Dot (5th Gen) | Smart speaker with Alexa and Vibrant Sound',
        category: 'Electronics',
        price: 49.99,
        originalPrice: 69.99,
        rating: 4.7,
        reviewsCount: 14230,
        isPrime: true,
        image: 'https://images.unsplash.com/photo-1543512214-318c7553f230?auto=format&fit=crop&q=80&w=800',
        description: 'Our best sounding Echo Dot yet – Enjoy an improved audio experience compared to any previous Echo Dot with Alexa for clearer vocals, deeper bass and vibrant sound.',
        badge: 'Best Seller',
      },
      {
        id: 'prod-2',
        title: 'Wireless Noise Cancelling Over-Ear Headphones with Mic',
        category: 'Electronics',
        price: 198.00,
        originalPrice: 249.99,
        rating: 4.8,
        reviewsCount: 8920,
        isPrime: true,
        image: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&q=80&w=800',
        description: 'Industry-leading noise cancellation technology means you hear every word, note, and tune with incredible clarity.',
        badge: 'Deal of the Day',
      },
      {
        id: 'prod-3',
        title: 'Ergonomic Mesh Office Chair with Adjustable Lumbar Support',
        category: 'Home & Kitchen',
        price: 149.99,
        originalPrice: 199.99,
        rating: 4.4,
        reviewsCount: 3105,
        isPrime: true,
        image: 'https://images.unsplash.com/photo-1580481072645-022f9a6d1270?auto=format&fit=crop&q=80&w=800',
        description: 'Stay comfortable during long work sessions with breathable mesh back support and dynamic height adjustment.',
        badge: 'Save 25%',
      },
      {
        id: 'prod-4',
        title: 'Minimalist Stainless Steel Insulated Water Bottle - 32oz',
        category: 'Home & Kitchen',
        price: 24.95,
        originalPrice: 34.95,
        rating: 4.9,
        reviewsCount: 21500,
        isPrime: true,
        image: 'https://images.unsplash.com/photo-1602143407151-7111542de6e8?auto=format&fit=crop&q=80&w=800',
        description: 'Double-wall vacuum insulation keeps drinks ice cold for 24 hours or piping hot for 12 hours.',
        badge: 'Top Rated',
      },
      {
        id: 'prod-5',
        title: 'Classic Denim Trucker Jacket - 100% Organic Cotton',
        category: 'Fashion',
        price: 68.50,
        originalPrice: 89.00,
        rating: 4.5,
        reviewsCount: 1840,
        isPrime: false,
        image: 'https://images.unsplash.com/photo-1576995853123-5a10305d93c0?auto=format&fit=crop&q=80&w=800',
        description: 'A timeless staple for every wardrobe. Crafted from durable organic denim with classic copper hardware.',
        badge: null,
      },
      {
        id: 'prod-6',
        title: 'Smart Fitness Watch with Heart Rate & Sleep Tracker',
        category: 'Electronics',
        price: 89.99,
        originalPrice: 119.99,
        rating: 4.3,
        reviewsCount: 5410,
        isPrime: true,
        image: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&q=80&w=800',
        description: 'Track your daily activities, sleep stages, heart rate metrics, and workout routines.',
        badge: 'Limited Time',
      }
    ];

    const CATEGORIES = ['All Departments', 'Electronics', 'Home & Kitchen', 'Fashion', 'Books', 'Beauty', 'Toys & Games'];

    function PickWishApp() {
      // States
      const [products] = useState(INITIAL_PRODUCTS);
      const [selectedCategory, setSelectedCategory] = useState('All Departments');
      const [searchQuery, setSearchQuery] = useState('');
      const [onlyPrime, setOnlyPrime] = useState(false);
      
      const [cart, setCart] = useState([]);
      const [wishlist, setWishlist] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isAccountOpen, setIsAccountOpen] = useState(false);
      const [isSideMenuOpen, setIsSideMenuOpen] = useState(false);
      const [userLocation, setUserLocation] = useState('New Delhi 110001');
      const [toastMsg, setToastMsg] = useState('');

      // Refresh icons on state change
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Show Toast Notification
      const showToast = (message) => {
        setToastMsg(message);
        setTimeout(() => setToastMsg(''), 3000);
      };

      // Add To Cart logic
      const addToCart = (product) => {
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
          }
          return [...prev, { ...product, quantity: 1 }];
        });
        showToast(`Added "${product.title.slice(0, 20)}..." to your cart!`);
      };

      // Remove from cart
      const updateQuantity = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      // Toggle Wishlist
      const toggleWishlist = (product) => {
        setWishlist(prev => {
          const exists = prev.some(item => item.id === product.id);
          if (exists) {
            showToast('Removed item from Wishlist.');
            return prev.filter(item => item.id !== product.id);
          } else {
            showToast('Saved to PickWish List!');
            return [...prev, product];
          }
        });
      };

      // Computed Values
      const cartCount = useMemo(() => cart.reduce((sum, item) => sum + item.quantity, 0), [cart]);
      const cartTotal = useMemo(() => cart.reduce((sum, item) => sum + (item.price * item.quantity), 0), [cart]);

      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const matchesCategory = selectedCategory === 'All Departments' || p.category === selectedCategory;
          const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase());
          const matchesPrime = !onlyPrime || p.isPrime;
          return matchesCategory && matchesSearch && matchesPrime;
        });
      }, [products, selectedCategory, searchQuery, onlyPrime]);

      return (
        <div className="min-h-screen flex flex-col bg-gray-100">
          
          {/* TOAST POPUP */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 bg-gray-900 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 border border-gray-700 animate-fade-in text-xs font-semibold">
              <i data-lucide="check-circle" class="w-4 h-4 text-amber-400"></i>
              <span>{toastMsg}</span>
            </div>
          )}

          {/* ========================================= */}
          {/* AMAZON-STYLE PICKWISH HEADER */}
          {/* ========================================= */}
          <header className="sticky top-0 z-40 bg-[#131921] text-white select-none">
            
            {/* Top Bar */}
            <div className="max-w-[1500px] mx-auto px-3 sm:px-4 py-2 flex items-center justify-between gap-2 sm:gap-4">
              
              {/* Logo */}
              <button 
                onClick={() => { setSelectedCategory('All Departments'); setSearchQuery(''); }}
                className="flex items-center gap-1 p-1.5 rounded border border-transparent hover:border-white transition shrink-0"
              >
                <span className="text-2xl font-black tracking-tight text-white">
                  Pick<span className="text-amber-400">Wish</span>
                </span>
                <span className="text-[10px] font-bold text-gray-400 self-start mt-1">.in</span>
              </button>

              {/* Location Picker */}
              <button 
                onClick={() => {
                  const loc = prompt("Enter delivery pincode/city:", userLocation);
                  if (loc) setUserLocation(loc);
                }}
                className="hidden lg:flex items-center gap-1.5 p-1.5 rounded border border-transparent hover:border-white transition text-left shrink-0"
              >
                <i data-lucide="map-pin" class="w-4 h-4 text-white mt-1"></i>
                <div className="flex flex-col text-[11px]">
                  <span className="text-gray-300 leading-tight">Deliver to</span>
                  <span className="font-bold text-white leading-tight">{userLocation.split(' ')[0]}</span>
                </div>
              </button>

              {/* Search Bar */}
              <div className="flex-1 max-w-3xl flex items-center">
                <div className="flex w-full rounded-md overflow-hidden bg-white focus-within:ring-2 focus-within:ring-amber-500">
                  <select 
                    value={selectedCategory} 
                    onChange={(e) => setSelectedCategory(e.target.value)}
                    className="bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs px-3 py-2 border-r border-gray-300 outline-none cursor-pointer font-medium hidden sm:block max-w-[140px] truncate"
                  >
                    {CATEGORIES.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                  </select>

                  <input 
                    type="text" 
                    placeholder="Search PickWish deals, items & categories..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full px-3 py-2 text-sm text-gray-900 outline-none placeholder-gray-500"
                  />

                  <button className="bg-amber-400 hover:bg-amber-500 text-gray-900 px-4 flex items-center justify-center font-bold transition shrink-0">
                    <i data-lucide="search" class="w-5 h-5"></i>
                  </button>
                </div>
              </div>

              {/* Account Dropdown */}
              <div className="relative">
                <button 
                  onClick={() => setIsAccountOpen(!isAccountOpen)}
                  className="flex flex-col text-left p-1.5 rounded border border-transparent hover:border-white transition cursor-pointer"
                >
                  <span className="text-[11px] text-gray-300 leading-tight">Hello, Sign in</span>
                  <span className="font-bold text-xs text-white leading-tight flex items-center gap-0.5">
                    Account & Lists <i data-lucide="chevron-down" class="w-3 h-3 text-gray-400"></i>
                  </span>
                </button>

                {isAccountOpen && (
                  <div className="absolute right-0 top-full mt-1 bg-white text-gray-900 rounded-lg shadow-2xl border border-gray-200 p-4 w-64 z-50 text-xs animate-fade-in">
                    <button className="w-full bg-amber-400 hover:bg-amber-500 font-bold py-1.5 rounded text-xs mb-3 shadow-sm">
                      Sign In
                    </button>
                    <div className="border-t border-gray-100 pt-3">
                      <h4 className="font-bold text-gray-900 mb-2">Your Lists</h4>
                      <ul className="space-y-1.5 text-gray-600">
                        <li className="hover:text-amber-600 cursor-pointer flex justify-between">
                          <span>Wishlist</span>
                          <span className="font-bold text-amber-600">{wishlist.length}</span>
                        </li>
                        <li className="hover:text-amber-600 cursor-pointer">Saved Shopping Cart</li>
                      </ul>
                    </div>
                  </div>
                )}
              </div>

              {/* Orders */}
              <button className="hidden sm:flex flex-col text-left p-1.5 rounded border border-transparent hover:border-white transition shrink-0">
                <span className="text-[11px] text-gray-300 leading-tight">Returns</span>
                <span className="font-bold text-xs text-white leading-tight">& Orders</span>
              </button>

              {/* Shopping Cart Button */}
              <button 
                onClick={() => setIsCartOpen(true)}
                className="flex items-center p-1.5 rounded border border-transparent hover:border-white transition relative shrink-0"
              >
                <div className="relative">
                  <i data-lucide="shopping-cart" class="w-7 h-7 text-white"></i>
                  <span className="absolute -top-1.5 -right-1 bg-amber-500 text-gray-900 font-black text-[11px] px-1.5 py-0.2 rounded-full min-w-[18px] text-center">
                    {cartCount}
                  </span>
                </div>
                <span className="font-bold text-xs hidden sm:inline ml-2 self-end mb-0.5">Cart</span>
              </button>

            </div>

            {/* Sub Nav Bar */}
            <div className="bg-[#232f3e] text-xs font-semibold px-3 sm:px-4 py-1.5 flex items-center gap-3 overflow-x-auto scrollbar-none border-t border-gray-800">
              <button 
                onClick={() => setIsSideMenuOpen(true)}
                className="flex items-center gap-1 hover:border hover:border-white px-2 py-1 rounded transition text-white font-bold shrink-0"
              >
                <i data-lucide="menu" class="w-4 h-4"></i> All
              </button>

              {CATEGORIES.slice(1, 5).map(cat => (
                <button 
                  key={cat}
                  onClick={() => setSelectedCategory(cat)}
                  className={`hover:border hover:border-white px-2 py-1 rounded shrink-0 ${selectedCategory === cat ? 'text-amber-400 font-bold' : 'text-gray-200'}`}
                >
                  {cat}
                </button>
              ))}

              <span className="text-gray-600">|</span>

              <button 
                onClick={() => setOnlyPrime(!onlyPrime)}
                className={`flex items-center gap-1 px-2 py-1 rounded shrink-0 ${onlyPrime ? 'bg-cyan-900 text-cyan-300 font-bold' : 'hover:border hover:border-white text-gray-200'}`}
              >
                <i data-lucide="sparkles" class="w-3.5 h-3.5 text-cyan-400"></i> Today's PickWish Deals
              </button>
            </div>
          </header>

          {/* ================= SIDE DRAWER ================= */}
          {isSideMenuOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 flex animate-fade-in">
              <div className="bg-white w-72 h-full shadow-2xl flex flex-col justify-between overflow-y-auto">
                <div>
                  <div className="bg-[#232f3e] text-white p-4 flex justify-between items-center">
                    <span className="font-bold text-base flex items-center gap-2">
                      <i data-lucide="user" class="w-5 h-5 bg-gray-600 rounded-full p-0.5"></i> Hello, Sign in
                    </span>
                    <button onClick={() => setIsSideMenuOpen(false)} className="text-gray-300 hover:text-white">
                      <i data-lucide="x" class="w-6 h-6"></i>
                    </button>
                  </div>

                  <div className="p-4">
                    <h4 className="font-bold text-gray-900 text-xs uppercase tracking-wider mb-3">Shop By Department</h4>
                    <ul className="space-y-2 text-xs font-medium text-gray-700">
                      {CATEGORIES.map(cat => (
                        <li 
                          key={cat}
                          onClick={() => { setSelectedCategory(cat); setIsSideMenuOpen(false); }}
                          className="p-2 hover:bg-gray-100 rounded cursor-pointer flex justify-between items-center"
                        >
                          <span>{cat}</span>
                          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ================= MAIN PRODUCTS GRID ================= */}
          <main className="flex-1 max-w-[1500px] w-full mx-auto px-4 py-6">
            
            {/* Header / Filter status */}
            <div className="flex justify-between items-center mb-6 bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
              <div>
                <h1 className="text-lg font-bold text-gray-900">{selectedCategory}</h1>
                <p className="text-xs text-gray-500">Showing {filteredProducts.length} curated products on PickWish</p>
              </div>

              <button 
                onClick={() => setOnlyPrime(!onlyPrime)}
                className={`text-xs px-3 py-1.5 rounded-full border font-bold flex items-center gap-1.5 transition ${
                  onlyPrime ? 'bg-cyan-100 border-cyan-500 text-cyan-800' : 'bg-gray-50 border-gray-300 text-gray-700'
                }`}
              >
                <i data-lucide="sparkles" class="w-3.5 h-3.5 text-cyan-600"></i> Express Prime Only
              </button>
            </div>

            {/* Product Cards */}
            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
              {filteredProducts.map(product => (
                <div key={product.id} className="bg-white rounded-xl border border-gray-200 p-4 flex flex-col justify-between hover:shadow-xl transition group">
                  <div>
                    {product.badge && (
                      <span className="bg-amber-100 text-amber-800 text-[10px] font-extrabold px-2 py-0.5 rounded-full uppercase tracking-wide">
                        {product.badge}
                      </span>
                    )}

                    <img 
                      src={product.image} 
                      alt={product.title} 
                      className="w-full h-48 object-contain my-3 group-hover:scale-105 transition duration-200" 
                    />

                    <h3 className="font-bold text-sm text-gray-900 line-clamp-2 leading-snug">{product.title}</h3>
                    
                    <div className="flex items-center gap-1 mt-2 text-amber-400">
                      <i data-lucide="star" class="w-3.5 h-3.5 fill-current"></i>
                      <span className="text-xs font-bold text-gray-700 ml-1">{product.rating}</span>
                      <span className="text-xs text-cyan-700 ml-1">({product.reviewsCount})</span>
                    </div>

                    <div className="mt-2 flex items-baseline gap-2">
                      <span className="text-2xl font-black text-gray-900">${product.price.toFixed(2)}</span>
                      {product.originalPrice && (
                        <span className="text-xs text-gray-400 line-through">${product.originalPrice.toFixed(2)}</span>
                      )}
                    </div>
                  </div>

                  {/* Actions */}
                  <div className="mt-4 flex gap-2 pt-2 border-t border-gray-100">
                    <button 
                      onClick={() => addToCart(product)}
                      className="flex-1 bg-amber-400 hover:bg-amber-500 font-bold text-xs py-2 rounded-lg transition shadow-sm text-gray-900"
                    >
                      Add to Cart
                    </button>

                    <button 
                      onClick={() => toggleWishlist(product)}
                      className="p-2 border border-gray-300 rounded-lg hover:bg-gray-50 text-gray-600 transition"
                    >
                      <i data-lucide="heart" class={`w-4 h-4 ${wishlist.some(w => w.id === product.id) ? 'fill-red-500 text-red-500' : ''}`}></i>
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </main>

          {/* ================= CART DRAWER ================= */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 flex justify-end animate-fade-in">
              <div className="bg-white w-full max-w-md h-full flex flex-col justify-between p-6 shadow-2xl">
                <div>
                  <div className="flex justify-between items-center pb-4 border-b">
                    <h3 className="font-bold text-lg text-gray-900 flex items-center gap-2">
                      <i data-lucide="shopping-cart" class="w-5 h-5 text-amber-500"></i> Shopping Cart ({cartCount})
                    </h3>
                    <button onClick={() => setIsCartOpen(false)} className="p-1 hover:bg-gray-100 rounded-full text-gray-500">
                      <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                  </div>

                  {cart.length === 0 ? (
                    <div className="text-center py-12 text-gray-500">
                      <i data-lucide="shopping-bag" class="w-12 h-12 mx-auto text-gray-300 mb-2"></i>
                      <p className="text-sm font-semibold">Your PickWish cart is empty.</p>
                    </div>
                  ) : (
                    <div className="space-y-4 my-4 max-h-[60vh] overflow-y-auto pr-1">
                      {cart.map(item => (
                        <div key={item.id} className="flex gap-3 pb-3 border-b border-gray-100 items-center">
                          <img src={item.image} alt={item.title} className="w-14 h-14 object-contain rounded border" />
                          <div className="flex-1 text-xs">
                            <h4 className="font-bold text-gray-900 line-clamp-1">{item.title}</h4>
                            <div className="font-extrabold text-amber-600 mt-0.5">${item.price.toFixed(2)}</div>
                            
                            <div className="flex items-center gap-2 mt-2">
                              <button onClick={() => updateQuantity(item.id, -1)} className="w-5 h-5 bg-gray-200 rounded font-bold text-xs">-</button>
                              <span className="font-bold">{item.quantity}</span>
                              <button onClick={() => updateQuantity(item.id, 1)} className="w-5 h-5 bg-gray-200 rounded font-bold text-xs">+</button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <div className="border-t border-gray-200 pt-4">
                  <div className="flex justify-between items-center font-black text-lg mb-4 text-gray-900">
                    <span>Subtotal:</span>
                    <span className="text-amber-600">${cartTotal.toFixed(2)}</span>
                  </div>

                  <button 
                    disabled={cart.length === 0}
                    onClick={() => {
                      alert(`Thank you for shopping on PickWish! Your order of $${cartTotal.toFixed(2)} is placed.`);
                      setCart([]);
                      setIsCartOpen(false);
                    }}
                    className="w-full bg-amber-400 hover:bg-amber-500 disabled:bg-gray-300 text-gray-900 font-extrabold py-3 rounded-xl transition shadow-md"
                  >
                    Proceed to Checkout
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-[#131921] text-gray-400 text-xs py-8 text-center border-t border-gray-800 mt-12">
            <div className="max-w-md mx-auto space-y-2">
              <div className="text-xl font-black text-white">
                Pick<span className="text-amber-400">Wish</span>
              </div>
              <p>© 2026 PickWish Inc. All rights reserved.</p>
            </div>
          </footer>

        </div>
      );
    }

    // Mount React App to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PickWishApp />);
  </script>
</body>
</html>
